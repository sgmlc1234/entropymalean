[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-malean-1"
version = "0.1.0"
description = "Lean-gated evolution of mathematical theorem-proving benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Anonymous Authors", email = "anonymous@example.com"}
]
keywords = [
    "mathematics",
    "problem generation",
    "formal verification",
    "theorem proving",
    "lean4",
    "ai4math"
]

dependencies = [
    "pydantic>=2.5.0",
    "pydantic-core>=2.14.0",
    "langgraph>=0.1.0",
    "langsmith>=0.1.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "black==23.12.0",
    "isort==5.13.2",
    "flake8==6.1.0",
    "mypy==1.7.1",
]

test = [
    "pytest==7.4.3",
]

docs = [
    "sphinx==7.2.6",
    "sphinx-rtd-theme==2.0.0",
    "sphinx-autodoc-typehints==1.25.2",
]

[tool.setuptools]
packages = [
    "src",
    "src.certification",
    "src.evaluation",
    "src.orchestration",
    "src.orchestration.nodes",
    "src.retrieval",
    "src.utils",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
